<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake API and Google Map</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#333;
    color:white;
}

a{
    color:blue;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

</style>

</head>
<body>

<h1>Users Information</h1>

<table id="userTable">

<thead>
<tr>
<th>ID</th>
<th>First Name</th>
<th>Last Name</th>
<th>Username</th>
<th>Email</th>
<th>Zipcode</th>
<th>Latitude</th>
<th>Longitude</th>
<th>Location</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

<script>

fetch("https://jsonplaceholder.typicode.com/users")

.then(response => response.json())

.then(users => {

    const tableBody = document.querySelector("#userTable tbody");

    users.forEach(user => {

        const nameParts = user.name.split(" ");
        const firstName = nameParts[0];
        const lastName = nameParts.slice(1).join(" ");

        const lat = user.address.geo.lat;
        const lng = user.address.geo.lng;

        const mapLink = `https://www.google.com/maps/@${lat},${lng},15z`;

        const row = `
        <tr>
            <td>${user.id}</td>
            <td>${firstName}</td>
            <td>${lastName}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.address.zipcode}</td>
            <td>${lat}</td>
            <td>${lng}</td>
            <td><a href="${mapLink}" target="_blank">View Location</a></td>
        </tr>
        `;

        tableBody.innerHTML += row;

    });


    const myLat = "8.0570696";
    const myLng = "123.7224303";

    const myMap = `https://www.google.com/maps/@${myLat},${myLng},15z`;

    const myRow = `
    <tr style="background:#dff0d8;">
        <td>11</td>
        <td>Vincent</td>
        <td>Ampong</td>
        <td>vincent123</td>
        <td>vincentampong.nmsc.edu.ph</td>
        <td>7014</td>
        <td>7.8508339</td>
        <td>123.1853683</td>
        <td><a href="https://www.google.com/maps/place/JH+Cerilles+State+College+-+Canuto+MS+Enerio+Campus/@7.8508339,123.1853683,187m/data=!3m1!1e3!4m15!1m8!3m7!1s0x32540f61ca79294d:0xffd5971abc24c098!2sBiswangan,+Lakewood,+Zamboanga+del+Sur!3b1!8m2!3d7.8641045!4d123.1969924!16s%2Fg%2F11fyxb61qy!3m5!1s0x325405b1228d0b87:0x3801caa881022657!8m2!3d7.8506184!4d123.1856388!16s%2Fg%2F11ky4765ww?entry=ttu&g_ep=EgoyMDI2MDMxMS4wIKXMDSoASAFQAw%3D%3D" target="_blank">View Location</a></td>
    </tr>
    `;

    tableBody.innerHTML += myRow;

});

</script>

</body>
</html>
